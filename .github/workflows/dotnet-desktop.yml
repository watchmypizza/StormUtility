name: .NET Build & Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-24.04

    env:
      sol: Stormtility.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Restore dependencies
      run: dotnet restore ${{ env.sol }}

    - name: Build
      run: dotnet build ${{ env.sol }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish
      run: dotnet publish ${{ env.sol }} --configuration ${{ matrix.configuration }} -o output

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ matrix.configuration }}
        path: output
